# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  web:
    restart: unless-stopped
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    deploy:
      resources:
        limits:
          memory: 300m

  caddy:
    restart: unless-stopped
