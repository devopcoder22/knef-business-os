# ============================================================
# KNEF Business OS — Local UAT Docker Compose Override
# ============================================================
# Reuses existing built images (knef-business-os-*) with
# isolated UAT volumes and ports. No rebuild required.
#
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.local.yml \
#     --project-name knef-uat \
#     up -d
#
# Ports exposed:
#   API           → http://localhost:4000
#   Web (Admin)   → http://localhost:3002
#   Storefront    → http://localhost:3001
#   Postgres      → localhost:5433  (psql/pgAdmin direct access)
#   Redis         → localhost:6380  (redis-cli direct access)
#   MCP Server    → http://localhost:4101
# ============================================================

services:
  # ── Disable Caddy for UAT (use direct port access) ─────────────────────────
  caddy:
    profiles:
      - disabled

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: knef-business-os-api:latest
    env_file:
      - apps/api/.env.uat
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Staff Web App ───────────────────────────────────────────────────────────
  web:
    image: knef-business-os-web:latest
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NODE_ENV=development

  # ── Storefront ───────────────────────────────────────────────────────────────
  storefront:
    image: knef-business-os-storefront:latest
    env_file:
      - apps/storefront/.env.uat
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - STOREFRONT_BACKEND_URL=http://api:4000
      - STOREFRONT_INTERNAL_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy

  # ── Worker ──────────────────────────────────────────────────────────────────
  worker:
    image: knef-business-os-worker:latest
    env_file:
      - apps/api/.env.uat
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MCP Server ──────────────────────────────────────────────────────────────
  mcp-server:
    image: knef-uat-mcp-server:latest
    env_file:
      - apps/api/.env.uat
    ports:
      - "4101:4100"
    environment:
      - MCP_SERVER_PORT=4100
      - KNEF_API_URL=http://api:4000

  # ── Postgres — isolated UAT instance ────────────────────────────────────────
  db:
    environment:
      POSTGRES_DB: knef_uat
      POSTGRES_USER: knef
      POSTGRES_PASSWORD: uat_local_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knef -d knef_uat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — expose for local inspection ─────────────────────────────────────
  redis:
    ports:
      - "6380:6379"
